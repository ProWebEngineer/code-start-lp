# main への push、または手動実行で Astro サイトをビルドし GitHub Pages に公開する。
# https://docs.astro.build/en/guides/deploy/github/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# リポジトリの取得と Pages へのデプロイに必要な権限。
permissions:
  contents: read
  pages: write
  id-token: write

# 進行中の本番デプロイは完了させ、待ち行列は最新の1件だけ残す。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          # package.json の engines は Node >=22.22.0。
          node-version: "22"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
